<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShopLite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand"><div class="logo">🛒</div><div><b>ShopLite</b><small>Inventory &amp; Billing</small></div></div>
    <nav id="nav">
      <button data-tab="dashboard" class="active"><span class="ni">📊</span>Dashboard</button>
      <button data-tab="products"><span class="ni">📦</span>Products</button>
      <button data-tab="billing"><span class="ni">🧾</span>New Bill</button>
      <button data-tab="bills"><span class="ni">📚</span>Bills</button>
      <button data-tab="lowstock"><span class="ni">⚠️</span>Low Stock <span id="lowCount" class="pill hidden"></span></button>
    </nav>
    <div class="side-foot">ShopLite · Spring Boot</div>
  </aside>

  <div class="main-area">
    <header class="topbar">
      <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub"></p></div>
      <div class="top-right"><span id="todayLabel"></span><button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="Dark / light">🌙</button></div>
    </header>

    <main>
      <!-- DASHBOARD -->
      <section id="dashboard" class="tab active">
        <div class="stats" id="stats"></div>
        <div class="grid2">
          <div class="panel">
            <h3>Sales, last 7 days</h3><p class="sub">Only finalized bills are counted</p>
            <div class="chart" id="chart"></div>
          </div>
          <div class="panel">
            <h3>Needs reordering</h3><p class="sub">Stock below reorder level</p>
            <div id="dashLow"></div>
          </div>
        </div>
        <div class="grid2">
          <div class="panel">
            <h3>Recent bills</h3><p class="sub">Latest 5</p>
            <div id="dashBills"></div>
          </div>
          <div class="panel">
            <h3>Sales for a day</h3><p class="sub">Pick any date</p>
            <div class="sales-lookup">
              <div class="grow"><input type="date" id="salesDate"></div>
              <button class="btn" onclick="loadSales()">Show</button>
            </div>
            <div id="salesResult" class="big-note"></div>
          </div>
        </div>
      </section>

      <!-- PRODUCTS -->
      <section id="products" class="tab">
        <div class="toolbar">
          <div class="grow"><label>Search by name</label><input id="searchBox" placeholder="e.g. milk" onkeydown="if(event.key==='Enter')loadProducts()"></div>
          <button class="btn" onclick="loadProducts()">Search</button>
          <button class="btn gray" onclick="clearSearch()">Show all</button>
          <button class="btn green push" onclick="openModal()">+ Add product</button>
        </div>
        <div id="productTable"></div>
      </section>

      <!-- BILLING -->
      <section id="billing" class="tab">
        <div class="pos">
          <div>
            <div class="toolbar"><div class="grow"><label>Find product</label><input id="posSearch" placeholder="Type to filter..." oninput="renderPos()"></div></div>
            <div id="posGrid" class="products-grid"></div>
          </div>
          <div class="panel cart">
            <h3>Current bill</h3><p class="sub">Tap products to add them</p>
            <div id="cartBody"></div>
            <div class="cart-total"><span>Total</span><span id="cartTotal">₹0.00</span></div>
            <button class="btn green wide" onclick="checkout()">✔ Finalize bill</button>
            <button class="btn gray wide" onclick="clearCart()">Clear</button>
          </div>
        </div>
      </section>

      <!-- BILLS -->
      <section id="bills" class="tab">
        <div class="toolbar">
          <div><label>Filter by date created</label><input type="date" id="billDate"></div>
          <button class="btn" onclick="loadBills()">Filter</button>
          <button class="btn gray" onclick="clearBillFilter()">Show all</button>
        </div>
        <div id="billTable"></div>
      </section>

      <!-- LOW STOCK -->
      <section id="lowstock" class="tab">
        <div id="lowTable"></div>
      </section>
    </main>
  </div>
</div>

<!-- product modal -->
<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h3 id="modalTitle">Add product</h3>
    <input type="hidden" id="pId">
    <label>Name</label><input id="pName" placeholder="Milk 1L">
    <label>Description</label><input id="pDesc" placeholder="Optional">
    <div class="two">
      <div><label>Price (₹)</label><input id="pPrice" type="number" step="0.01" min="0"></div>
      <div><label>Stock quantity</label><input id="pStock" type="number" min="0"></div>
    </div>
    <label>Reorder level</label><input id="pReorder" type="number" min="0">
    <div class="actions">
      <button class="btn gray" onclick="closeModal()">Cancel</button>
      <button class="btn" onclick="saveProduct()">Save</button>
    </div>
  </div>
</div>

<!-- receipt modal -->
<div id="receipt" class="modal hidden">
  <div class="modal-box" id="receiptBox">
    <div id="receiptBody"></div>
    <div class="actions no-print">
      <button class="btn gray" onclick="closeReceipt()">Close</button>
      <button class="btn" onclick="printReceipt()">🖨 Print</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="js/app.js"></script>
</body>
</html>
